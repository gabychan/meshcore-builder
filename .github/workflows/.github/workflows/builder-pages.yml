name: Deploy Builder to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "custom_builder_web/**"
      - ".github/workflows/builder-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./custom_builder_web"
      - id: deployment
        uses: actions/deploy-pages@v4
